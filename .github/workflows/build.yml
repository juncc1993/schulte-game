name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Buildozer Docker
      run: |
        docker run --rm \
          -v "$(pwd)":/home/user/host \
          -w /home/user/host \
          -u root \
          kivy/buildozer:latest \
          bash -c "
            # 修改 Buildozer 源码，跳过 root 检测
            sed -i 's/self.check_root()/pass/' /home/user/.venv/lib/python3.14/site-packages/buildozer/__init__.py
            # 编译 APK
            buildozer android debug
          "
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: schulte-apk
        path: bin/*.apk
