name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Buildozer Docker
      run: |
        docker run --rm \
          -v "$(pwd)":/home/user/host \
          -w /home/user/host \
          --user root \
          kivy/buildozer:stable \
          buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: schulte-apk
        path: bin/*.apk
