name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
    
    - name: Download and setup Android SDK
      run: |
        BZ_DIR="$HOME/.buildozer/android/platform"
        mkdir -p "$BZ_DIR"
        cd "$BZ_DIR"
        
        # 下载 SDK 命令行工具
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p android-sdk/cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        rm -rf cmdline-tools
        
        # Buildozer 期望 sdkmanager 在 tools/bin/ 下
        mkdir -p android-sdk/tools/bin
        ln -sf "$BZ_DIR/android-sdk/cmdline-tools/latest/bin/sdkmanager" android-sdk/tools/bin/sdkmanager
        
        # 安装 SDK 组件
        export PATH="$BZ_DIR/android-sdk/cmdline-tools/latest/bin:$PATH"
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33"
        
        # 创建 license 文件
        mkdir -p android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> android-sdk/licenses/android-sdk-license
    
    - name: Download Android NDK
      run: |
        BZ_DIR="$HOME/.buildozer/android/platform"
        cd "$BZ_DIR"
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
    
    - name: Cache buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Build APK
      run: |
        buildozer -v android debug
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: schulte-apk
        path: bin/*.apk
