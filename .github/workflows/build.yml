name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Fix permissions
      run: sudo chown -R 1000:1000 .
    
    - name: Build APK with Buildozer Docker
      run: |
        docker run --rm \
          -v "$(pwd)":/home/user/host \
          -w /home/user/host \
          kivy/buildozer:latest \
          bash -c 'export PATH=/home/user/.venv/bin:$PATH && yes | buildozer android debug'
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: schulte-apk
        path: bin/*.apk
