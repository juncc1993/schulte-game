name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
    
    - name: Link system Android SDK to Buildozer path
      run: |
        SYSTEM_SDK="/usr/local/lib/android/sdk"
        BZ_SDK="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$(dirname $BZ_SDK)"
        rm -rf "$BZ_SDK"
        ln -s "$SYSTEM_SDK" "$BZ_SDK"
        # Buildozer 期望 sdkmanager 在 tools/bin/ 下
        mkdir -p "$BZ_SDK/tools/bin"
        ln -sf "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" "$BZ_SDK/tools/bin/sdkmanager"
        # 接受所有许可证
        yes | sdkmanager --licenses || true
        # 安装 Buildozer 需要的 build-tools
        sdkmanager "build-tools;33.0.0" "platforms;android-33"
    
    - name: Cache buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Build APK
      run: |
        buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: schulte-apk
        path: bin/*.apk
