name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake libltdl-dev
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
    
    - name: Pre-setup Android SDK with correct paths
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR"
        cd "$SDK_DIR"
        # 下载新版命令行工具
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/latest/ 2>/dev/null || true
        mv cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
        # Buildozer 期望 sdkmanager 在 tools/bin/ 下，创建符号链接
        mkdir -p tools/bin
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" tools/bin/sdkmanager
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" tools/bin/avdmanager
        # 接受许可证
        yes | tools/bin/sdkmanager --licenses || true
        tools/bin/sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33"
        # 创建 license 文件
        mkdir -p licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> licenses/android-sdk-license
    
    - name: Cache buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Build APK
      run: |
        buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: schulte-apk
        path: bin/*.apk
